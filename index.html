<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <link rel="stylesheet" href="./assets/css/style.css" />

        <title>Fade Carousel</title>
    </head>

    <body>
        <main class="carousel">
            <!-- Container for all image slides -->

            <div class="carousel-track">
                <!-- The active class makes the first slide visible -->

                <div class="slide active">
                    <img src="./assets/images/1.jpg" alt="Landscape 1" />
                </div>

                <div class="slide">
                    <img src="./assets/images/2.jpg" alt="Landscape 2" />
                </div>

                <div class="slide">
                    <img src="./assets/images/3.jpg" alt="Landscape 3" />
                </div>

                <div class="slide">
                    <img src="./assets/images/4.jpg" alt="Landscape 4" />
                </div>
            </div>

            <!-- Navigation buttons -->
            <button class="arrow arrow-prev" aria-label="Previous slide">
                &#8592;
            </button>

            <button class="arrow arrow-next" aria-label="Next slide">
                &#8594;
            </button>

            <!-- Pagination dots -->
            <div class="pagination"></div>
        </main>

        <script src="./assets/js/main.js"></script>
    </body>
</html>
