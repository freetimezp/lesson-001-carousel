<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="./assets/css/style.css" />
        <title>Carousel</title>
    </head>

    <body>
        <main class="carousel">
            <!-- Container for all image slides -->
            <!-- контейнер для всіх слайдів -->
            <div class="carousel-track">
                <!-- The active class makes the first slide visible -->
                <!-- перший слайд зробимо активним , інші сховаємо -->
                <div class="slide active">
                    <img src="./assets/images/1.jpg" alt="" />
                </div>

                <div class="slide">
                    <img src="./assets/images/2.jpg" alt="" />
                </div>

                <div class="slide">
                    <img src="./assets/images/3.jpg" alt="" />
                </div>

                <div class="slide">
                    <img src="./assets/images/4.jpg" alt="" />
                </div>
            </div>

            <!-- Navigation buttons -->
            <!-- кнопки навігації -->
            <button class="arrow arrow-prev">&#8592;</button>
            <button class="arrow arrow-next">&#8594;</button>

            <!-- Pagination dots -->
            <!-- точки пагінації -->
            <div class="pagination"></div>
        </main>

        <!-- script file -->
        <!-- наш файл зі скриптоами -->
        <script src="./assets/js/main.js"></script>
    </body>
</html>
